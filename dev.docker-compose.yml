services:
  web:
    container_name: portfolio-dev
    build:
      context: .
      dockerfile: Dockerfile   # same Dockerfile, dev stage only
      target: dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/portfolio?schema=public
    env_file:
      - .env.local
    volumes:
      # Bind-mount source for hot-reload
      - .:/app
      # Preserve container's node_modules and .next (not overwritten by host bind-mount)
      - /app/node_modules
      - /app/.next
    # Run schema push + seed before starting the dev server
    command: >
      sh -c "npx prisma db push --accept-data-loss &&
             node prisma/seed.js || true &&
             npm run dev"
    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:15-alpine
    container_name: portfolio-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
