name: CI - Portfolio Test and Scan

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Run NextJS Production Build Check
        run: |
          DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" npm run build

      - name: Run Trivy Vulnerability Scan (Filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          output: 'trivy-fs-report.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Publish Trivy Filesystem Report to Summary
        if: always()
        run: |
          if [ -f trivy-fs-report.txt ]; then
            echo "## 🛡️ Trivy Filesystem Security Scan Report" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat trivy-fs-report.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local Load for Scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:temp-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scan on Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:temp-scan'
          format: 'table'
          output: 'trivy-image-report.txt'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Publish Trivy Image Report to Summary
        if: always()
        run: |
          if [ -f trivy-image-report.txt ]; then
            echo "## 🐳 Trivy Container Image Scan Report" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat trivy-image-report.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Automate Pull Request to Main
        if: success() && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Checking for existing Pull Requests..."
          PR_EXISTS=$(gh pr list --head dev --base main --state open --json number | jq '. | length')
          if [ "$PR_EXISTS" -eq 0 ]; then
            echo "🏗️ Creating automated Pull Request to main..."
            gh pr create \
              --head dev \
              --base main \
              --title "auto-pr: Merge dev into main (CI checks passed)" \
              --body "This PR was automatically created by the CI workflow because all security scans, linting checks, and Next.js builds passed successfully on the dev branch."
          else
            echo "✅ Pull Request already exists, skipping creation."
          fi
