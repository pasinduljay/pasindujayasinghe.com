name: CI/CD - Portfolio Build and Deploy

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================================
  # JOB 1: Continuous Integration (Runs on 'dev' branch push/PR)
  # ============================================================================
  ci-test:
    if: github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Run NextJS Production Build Check
        run: |
          # Use a dummy database URL during build time
          DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" npm run build

      - name: Run Trivy Vulnerability Scan (Filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          output: 'trivy-report.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Fail the build if CRITICAL or HIGH vulnerabilities are found

      - name: Publish Trivy Report to Summary
        if: always()
        run: |
          if [ -f trivy-report.txt ]; then
            echo "## 🛡️ Trivy Security Scan Report" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat trivy-report.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Automate Pull Request to Main
        if: success() && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Checking for existing Pull Requests..."
          PR_EXISTS=$(gh pr list --head dev --base main --state open --json number | jq '. | length')
          if [ "$PR_EXISTS" -eq 0 ]; then
            echo "🏗️ Creating automated Pull Request to main..."
            gh pr create \
              --head dev \
              --base main \
              --title "auto-pr: Merge dev into main (CI checks passed)" \
              --body "This PR was automatically created by the CI workflow because all security scans, linting checks, and Next.js builds passed successfully on the dev branch."
          else
            echo "✅ Pull Request already exists, skipping creation."
          fi

  # ============================================================================
  # JOB 2: Continuous Delivery (Runs on merge/push to 'main')
  # ============================================================================
  cd-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Version and Metadata
        id: meta
        run: |
          VERSION=$(grep '"version":' package.json | head -n 1 | cut -d'"' -f4)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          LOWERCASE_IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image_name=$LOWERCASE_IMAGE" >> $GITHUB_OUTPUT
          echo "version_tag=$LOWERCASE_IMAGE:v$VERSION" >> $GITHUB_OUTPUT
          echo "sha_tag=$LOWERCASE_IMAGE:$SHORT_SHA" >> $GITHUB_OUTPUT
          
          echo "🐳 Image Target: $LOWERCASE_IMAGE"
          echo "📌 Version Tag: v$VERSION"
          echo "📌 SHA Tag: $SHORT_SHA"

      - name: Build Docker Image (Local Load for Scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.image_name }}:temp-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scan on Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.meta.outputs.image_name }}:temp-scan'
          format: 'table'
          output: 'trivy-image-report.txt'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Fail CD if critical/high image vulnerabilities are found

      - name: Publish Trivy Image Report to Summary
        if: always()
        run: |
          if [ -f trivy-image-report.txt ]; then
            echo "## 🐳 Trivy Container Image Scan Report" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat trivy-image-report.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.version_tag }}
            ${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Build Summary
        run: |
          echo "## ✅ Portfolio Production Build Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`v${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | \`${{ steps.meta.outputs.version_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | \`${{ env.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
