name: Release - Publish to GHCR

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Version and Metadata
        id: meta
        run: |
          VERSION=$(grep '"version":' package.json | head -n 1 | cut -d'"' -f4)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          LOWERCASE_IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image_name=$LOWERCASE_IMAGE" >> $GITHUB_OUTPUT
          echo "version_tag=$LOWERCASE_IMAGE:v$VERSION" >> $GITHUB_OUTPUT
          echo "sha_tag=$LOWERCASE_IMAGE:$SHORT_SHA" >> $GITHUB_OUTPUT
          
          echo "🐳 Image Target: $LOWERCASE_IMAGE"
          echo "📌 Version Tag: v$VERSION"
          echo "📌 SHA Tag: $SHORT_SHA"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.version_tag }}
            ${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Build Summary
        run: |
          echo "## ✅ Portfolio Production Build Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`v${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | \`${{ steps.meta.outputs.version_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | \`${{ env.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
